<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
  <title>Neon Copter</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{background:#07070f;overflow:hidden;font-family:system-ui,sans-serif;touch-action:none;user-select:none}
    canvas{display:block}
    #ui{position:absolute;bottom:0;left:0;width:100%;padding:14px 18px 18px;pointer-events:none;display:flex;justify-content:space-between;color:#fff;font-size:14px;font-weight:600;text-shadow:0 0 10px rgba(100,200,255,.35)}
    #ui .dist{color:#7dd3fc;font-size:16px}
    #start,#over{position:absolute;inset:0;background:radial-gradient(ellipse at center,#0c0c1a 0%,#05050a 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;z-index:10;padding:24px}
    h1{font-size:34px;margin-bottom:6px;background:linear-gradient(90deg,#7dd3fc,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
    .sub{opacity:.6;font-size:13px;margin-bottom:22px}
    .btn{background:linear-gradient(135deg,#38bdf8,#818cf8);border:none;color:#fff;padding:13px 38px;font-size:16px;border-radius:50px;cursor:pointer;margin-top:16px;box-shadow:0 0 22px rgba(100,160,255,.4);pointer-events:auto}
    .btn:active{transform:scale(.95)}
    .info{max-width:290px;font-size:13px;line-height:1.55;opacity:.75;margin-top:16px}
    .score-big{font-size:42px;font-weight:800;margin:10px 0 4px;color:#7dd3fc}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div>BEST <span id="best">0</span></div>
  <div class="dist">DISTANCE <span id="dist">0</span></div>
</div>
<div id="start">
  <h1>NEON COPTER</h1>
  <div class="sub">Hold to fly • Release to fall</div>
  <div class="info">Hold to go up, release to fall.<br>Dodge walls and obstacles.</div>
  <button class="btn" id="go">START FLIGHT</button>
</div>
<div id="over" style="display:none">
  <h1>CRASHED</h1>
  <div class="score-big" id="final">0</div>
  <div style="opacity:.6;font-size:14px">Best: <span id="finalBest">0</span></div>
  <button class="btn" id="retry">FLY AGAIN</button>
</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H;
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
resize();addEventListener('resize',resize);

let actx=null;
function initAudio(){if(!actx)actx=new(AudioContext||webkitAudioContext);if(actx.state==='suspended')actx.resume()}
function tone(f,t,d,v=.06){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,actx.currentTime);g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}
function sfxThrust(){tone(170+Math.random()*35,'sawtooth',.035,.022)}
function sfxCrash(){tone(90,'sawtooth',.35,.1);setTimeout(()=>tone(55,'square',.4,.07),50)}

let dist=0,best=0,active=false,holding=false,speed=3.2,grav=.27,lift=-.41,shake=0,frame=0,spawnTimer=0;
try{best=parseInt(localStorage.getItem('neonCopterBest')||'0')}catch(e){}
document.getElementById('best').textContent=best;

const heli={x:0,y:0,vy:0,rot:0,rotor:0};
const walls=[],obstacles=[],particles=[],smoke=[];

function resetHeli(){heli.x=W*.23;heli.y=H*.5;heli.vy=0;heli.rot=0;heli.rotor=0}

function generateTerrain(){
  walls.length=0;obstacles.length=0;spawnTimer=0;
  for(let i=0;i<12;i++) walls.push({x:i*50,top:H*.15,bot:H*.85});
}

let seed=0;
function addSegment(){
  const last=walls[walls.length-1];
  const x=last.x+50;
  const t=seed*.06;
  const center=H*.5+Math.sin(t)*H*.16+Math.sin(t*1.7)*H*.07;
  const ht=H*(.42-Math.min(dist*.00012,.1));
  let top=Math.max(30,Math.min(H*.36,center-ht/2));
  let bot=Math.min(H-30,Math.max(H*.64,center+ht/2));
  walls.push({x,top,bot});
  seed++;
}

function spawnObstacle(){
  if(walls.length<3)return;
  const ref=walls[walls.length-2];
  const gap=ref.bot-ref.top;
  const kind=Math.random();
  const x=ref.x+20;

  if(kind<.33){
    const h=75+Math.random()*55;
    const y=ref.top+18+Math.random()*(gap-h-36);
    obstacles.push({x,y,w:44,h,type:'float'});
  } else if(kind<.66){
    const h=85+Math.random()*65;
    obstacles.push({x,y:ref.top,w:42,h,type:'top'});
  } else {
    const h=85+Math.random()*65;
    obstacles.push({x,y:ref.bot-h,w:42,h,type:'bot'});
  }
}

function drawHeli(){
  ctx.save();ctx.translate(heli.x,heli.y);ctx.rotate(heli.rot);
  ctx.fillStyle='rgba(56,189,248,.1)';ctx.beginPath();ctx.ellipse(0,10,26,12,0,0,Math.PI*2);ctx.fill();
  ctx.globalAlpha=.2;ctx.fillStyle='#bae6fd';ctx.beginPath();ctx.ellipse(0,-22,34,4.5,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;
  ctx.save();ctx.translate(0,-22);ctx.rotate(heli.rotor);ctx.strokeStyle='#e0f2fe';ctx.lineWidth=2.6;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(-32,0);ctx.lineTo(32,0);ctx.moveTo(0,-3);ctx.lineTo(0,3);ctx.stroke();ctx.restore();
  ctx.fillStyle='#64748b';ctx.beginPath();ctx.arc(0,-22,3.5,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#0ea5e9';ctx.fillRect(-34,-2,24,4);
  ctx.fillStyle='#38bdf8';ctx.fillRect(-38,-8,5,12);
  ctx.save();ctx.translate(-35.5,-2);ctx.rotate(heli.rotor*1.8);ctx.strokeStyle='#bae6fd';ctx.lineWidth=1.8;
  ctx.beginPath();ctx.moveTo(0,-7);ctx.lineTo(0,7);ctx.stroke();ctx.restore();
  const g=ctx.createLinearGradient(-14,-12,18,10);g.addColorStop(0,'#0284c7');g.addColorStop(.45,'#38bdf8');g.addColorStop(1,'#0ea5e9');
  ctx.beginPath();ctx.moveTo(-12,-8);ctx.quadraticCurveTo(6,-14,18,-4);ctx.quadraticCurveTo(22,2,16,10);ctx.quadraticCurveTo(4,14,-10,10);ctx.quadraticCurveTo(-16,4,-12,-8);ctx.closePath();ctx.fillStyle=g;ctx.fill();
  ctx.beginPath();ctx.moveTo(4,-9);ctx.quadraticCurveTo(14,-10,17,-2);ctx.quadraticCurveTo(16,4,8,5);ctx.quadraticCurveTo(2,2,4,-9);ctx.closePath();ctx.fillStyle='rgba(186,230,253,.55)';ctx.fill();
  ctx.strokeStyle='#7dd3fc';ctx.lineWidth=2.3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(-11,13);ctx.lineTo(13,13);ctx.moveTo(-7,10);ctx.lineTo(-7,13);ctx.moveTo(9,10);ctx.lineTo(9,13);ctx.stroke();
  if(holding){const fl=9+Math.random()*10;const fg=ctx.createLinearGradient(0,12,0,12+fl);fg.addColorStop(0,'#fdba74');fg.addColorStop(.4,'#f97316');fg.addColorStop(1,'transparent');ctx.fillStyle=fg;ctx.beginPath();ctx.moveTo(-5,12);ctx.quadraticCurveTo(0,12+fl*1.3,5,12);ctx.fill()}
  ctx.restore();
}

function drawWalls(){
  ctx.fillStyle='#1e293b';
  ctx.beginPath();ctx.moveTo(walls[0].x-30,0);walls.forEach(w=>ctx.lineTo(w.x,w.top));ctx.lineTo(walls[walls.length-1].x+50,0);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(walls[0].x-30,H);walls.forEach(w=>ctx.lineTo(w.x,w.bot));ctx.lineTo(walls[walls.length-1].x+50,H);ctx.closePath();ctx.fill();
  ctx.strokeStyle='#334155';ctx.lineWidth=2.5;
  ctx.beginPath();walls.forEach((w,i)=>i?ctx.lineTo(w.x,w.top):ctx.moveTo(w.x,w.top));ctx.stroke();
  ctx.beginPath();walls.forEach((w,i)=>i?ctx.lineTo(w.x,w.bot):ctx.moveTo(w.x,w.bot));ctx.stroke();
}

function drawObstacles(){
  obstacles.forEach(o=>{
    ctx.fillStyle='rgba(167,139,250,.12)';ctx.fillRect(o.x-4,o.y-4,o.w+8,o.h+8);
    const g=ctx.createLinearGradient(o.x,o.y,o.x+o.w,o.y+o.h);g.addColorStop(0,'#6366f1');g.addColorStop(1,'#8b5cf6');
    ctx.fillStyle=g;ctx.fillRect(o.x,o.y,o.w,o.h);
    ctx.fillStyle='rgba(199,210,254,.3)';ctx.fillRect(o.x,o.y,o.w,3);ctx.fillRect(o.x,o.y,3,o.h);
  });
}

function burst(x,y,col,n=18){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=2+Math.random()*5.5;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color:col,size:2+Math.random()*3})}}

function update(dt){
  if(holding){heli.vy+=lift;if(Math.random()<.35)sfxThrust()}else heli.vy+=grav;
  heli.vy*=.978;heli.vy=Math.max(-6.8,Math.min(7.5,heli.vy));heli.y+=heli.vy;
  heli.rot+=(heli.vy*.055-heli.rot)*.13;heli.rotor+=holding?1.15:.5;

  const scroll=speed;
  walls.forEach(w=>w.x-=scroll);obstacles.forEach(o=>o.x-=scroll);
  while(walls.length&&walls[0].x<-90)walls.shift();
  for(let i=obstacles.length-1;i>=0;i--)if(obstacles[i].x<-70)obstacles.splice(i,1);
  while(walls[walls.length-1].x<W+120)addSegment();

  // FIXED: regular obstacle spawn by timer
  spawnTimer+=dt;
  const interval=Math.max(.75,1.35-dist*.00008); // gets slightly denser
  if(spawnTimer>interval){spawnObstacle();spawnTimer=0}

  dist+=scroll*.14;
  const d=Math.floor(dist);
  document.getElementById('dist').textContent=d;
  if(d>best){best=d;document.getElementById('best').textContent=best}
  speed=3.2+Math.min(dist*.0035,4);

  if(frame%3===0)smoke.push({x:heli.x-16,y:heli.y+3,life:1,size:3.5+Math.random()*3.5});
  for(let i=smoke.length-1;i>=0;i--){smoke[i].x-=1.4;smoke[i].life-=.028;smoke[i].size+=.14;if(smoke[i].life<=0)smoke.splice(i,1)}
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.09;p.life-=.02;if(p.life<=0)particles.splice(i,1)}

  const hx=heli.x,hy=heli.y;
  for(const w of walls){if(w.x>hx-55&&w.x<hx+55){if(hy-14<w.top||hy+14>w.bot){crash();return}}}
  for(const o of obstacles){if(hx+17>o.x&&hx-15<o.x+o.w&&hy+11>o.y&&hy-12<o.y+o.h){crash();return}}
  if(hy<8||hy>H-8)crash();
}

function crash(){burst(heli.x,heli.y,'#f472b6',20);burst(heli.x,heli.y,'#7dd3fc',14);burst(heli.x,heli.y,'#fff',10);shake=13;sfxCrash();endGame()}

function draw(){
  ctx.fillStyle='#07070f';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.12)';
  for(let i=0;i<35;i++){const sx=((i*97)+dist*.25)%W,sy=(i*53)%H;ctx.beginPath();ctx.arc(sx,sy,1.1,0,Math.PI*2);ctx.fill()}
  drawWalls();drawObstacles();
  smoke.forEach(s=>{ctx.globalAlpha=s.life*.3;ctx.fillStyle='#94a3b8';ctx.beginPath();ctx.arc(s.x,s.y,s.size,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
  drawHeli();
  particles.forEach(p=>{ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*p.life,0,Math.PI*2);ctx.fill()});ctx.globalAlpha=1;
}

let last=0;
function loop(ts){if(!active)return;const dt=Math.min((ts-last)/1000,.05)||.016;last=ts;frame++;
  ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88}
  update(dt);draw();ctx.restore();requestAnimationFrame(loop)}

function setHold(v){holding=v;if(v)initAudio()}
canvas.addEventListener('mousedown',e=>{e.preventDefault();setHold(true)});
canvas.addEventListener('mouseup',()=>setHold(false));
canvas.addEventListener('mouseleave',()=>setHold(false));
canvas.addEventListener('touchstart',e=>{e.preventDefault();setHold(true)},{passive:false});
canvas.addEventListener('touchend',e=>{e.preventDefault();setHold(false)},{passive:false});
addEventListener('keydown',e=>{if(e.code==='Space'||e.key==='ArrowUp'){e.preventDefault();setHold(true)}});
addEventListener('keyup',e=>{if(e.code==='Space'||e.key==='ArrowUp')setHold(false)});

function startGame(){
  initAudio();document.getElementById('start').style.display='none';document.getElementById('over').style.display='none';
  active=true;holding=false;dist=0;speed=3.2;shake=0;seed=0;frame=0;spawnTimer=0;
  particles.length=0;smoke.length=0;resetHeli();generateTerrain();
  document.getElementById('dist').textContent='0';document.getElementById('best').textContent=best;
  last=performance.now();requestAnimationFrame(loop);
}
function endGame(){
  active=false;holding=false;const d=Math.floor(dist);
  if(d>best){best=d;try{localStorage.setItem('neonCopterBest',best)}catch(e){}}
  document.getElementById('final').textContent=d;document.getElementById('finalBest').textContent=best;document.getElementById('best').textContent=best;
  setTimeout(()=>document.getElementById('over').style.display='flex',380);
}
document.getElementById('go').onclick=startGame;
document.getElementById('retry').onclick=()=>{document.getElementById('over').style.display='none';startGame()};
</script>
</body>
</html>
